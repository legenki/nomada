<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nomada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M 14.474609 1.9746094 A 1.5 1.5 0 1 0 14.474609 4.9746094 A 1.5 1.5 0 1 0 14.474609 1.9746094 z M 11.759766 2.0117188 C 9.2547656 2.0717188 6.9798594 3.0576719 5.2558594 4.6386719 C 5.9088594 4.8836719 6.4689062 5.3103281 6.8789062 5.8613281 C 8.1309063 4.8153281 9.7076406 4.1512969 11.431641 4.0292969 C 11.398641 3.8492969 11.375 3.6646094 11.375 3.4746094 C 11.375 2.9426094 11.522766 2.4497187 11.759766 2.0117188 z M 17.552734 3.6894531 C 17.501734 4.4144531 17.207187 5.0692656 16.742188 5.5722656 C 18.713187 7.0312656 20 9.365 20 12 C 20 13.285 19.688437 14.495266 19.148438 15.572266 C 19.810437 15.791266 20.380547 16.191656 20.810547 16.722656 C 21.567547 15.314656 22 13.707 22 12 C 22 8.539 20.231734 5.4854531 17.552734 3.6894531 z M 4 6 A 2 2 0 0 0 4 10 A 2 2 0 0 0 4 6 z M 12 6 C 8.691 6 6 8.691 6 12 C 6 15.309 8.691 18 12 18 C 15.309 18 18 15.309 18 12 C 18 8.691 15.309 6 12 6 z M 12 8 C 14.206 8 16 9.794 16 12 C 16 14.206 14.206 16 12 16 C 9.794 16 8 14.206 8 12 C 8 9.794 9.794 8 12 8 z M 12 10 A 2 2 0 0 0 12 14 A 2 2 0 0 0 12 10 z M 2.0507812 11.017578 C 2.0187812 11.340578 2 11.668 2 12 C 2 17.514 6.486 22 12 22 C 13.188 22 14.323813 21.780438 15.382812 21.398438 C 14.928812 20.903437 14.609281 20.287609 14.488281 19.599609 C 13.704281 19.856609 12.869 20 12 20 C 7.589 20 4 16.411 4 12 C 4 11.864 4.0135313 11.731656 4.0195312 11.597656 C 4.0125313 11.597656 4.007 11.599609 4 11.599609 C 3.28 11.599609 2.6137812 11.382578 2.0507812 11.017578 z M 18.025391 16.974609 A 2 2 0 0 0 18.025391 20.974609 A 2 2 0 0 0 18.025391 16.974609 z"/></svg>
      Nomada
    </div>
    <div class="conn" role="radiogroup" aria-label="Connection">
      <label><input type="radio" name="conn" id="connDirect" value="direct"><span>Direct</span></label>
      <label><input type="radio" name="conn" id="connProxy" value="proxy"><span>Proxy</span></label>
    </div>
  </header>

  <main>
    <div class="globe-wrap">
      <canvas id="globe" aria-hidden="true"></canvas>
    </div>

    <section class="identity" aria-live="polite">
      <div class="status" id="status" data-state="off">
        <span class="status-dot"></span><span id="statusText">Your real location</span>
      </div>
      <h1 class="place" id="place">Locating…</h1>
      <p class="country" id="country">&nbsp;</p>
      <dl class="facts">
        <div><dt>Local time</dt><dd id="time">—</dd></div>
        <div><dt>Language</dt><dd id="lang">—</dd></div>
        <div><dt>IP address</dt><dd id="ip">—</dd></div>
      </dl>
      <p class="note" id="note" role="alert" hidden></p>
      <p class="moved" id="moved" role="status" hidden></p>
      <div class="access" id="blocked" hidden>
        <span>None of your proxies is answering. Traffic is blocked so your real IP stays hidden.</span>
        <button class="primary" id="retry" type="button">Try again</button>
      </div>
      <div class="access" id="access" hidden>
        <span>Nomada needs access to all sites to route them through the proxy and match their location.</span>
        <button class="primary" id="grantAccess" type="button">Allow</button>
      </div>
    </section>

    <section class="proxies">
      <div class="proxies-head">
        <span>Proxy</span>
        <div class="mode" id="mode" role="radiogroup" aria-label="When a proxy stops answering" hidden>
          <label><input type="radio" name="mode" id="modeSingle" value="single"><span>Single</span></label>
          <label><input type="radio" name="mode" id="modeFailover" value="failover"><span>Failover</span></label>
        </div>
        <button class="link" id="manage" type="button">Manage</button>
      </div>
      <div class="proxy-list" id="proxyList" role="radiogroup" aria-label="Proxy"></div>
      <div id="failoverFoot" hidden>
        <button class="add-backup" id="addBackup" type="button">+ Add backup</button>
        <p class="hint" id="failoverHint"></p>
      </div>
    </section>
  </main>

  <script type="module" src="./index.ts"></script>
</body>
</html>
